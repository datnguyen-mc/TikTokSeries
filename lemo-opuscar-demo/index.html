<!doctype html>
<html><head><meta charset="utf-8">
<title>Lemo-Opuscar — Một câu lệnh</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#F3F0EA;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// "Một câu lệnh" — a demo film for the Lemo-Opuscar plugin, Stick-figure Explainer style.
// Rig (skeleton, springs, even-hose drawing, clasp geometry) follows the technique of the style's engine; story, layout and timeline are this film's.
const W=1920, H=1080;
const cv=document.getElementById('c'), g=cv.getContext('2d');
const C={ paper:'#F3F0EA', ink:'#24242C', mute:'#9C978C', tint:'#E2DDD2', sig:'#EB4A2A' };
const F='BVP';
const QS=new URLSearchParams(location.search), FROM=+(QS.get('from')??0);

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a)), ss=t=>{t=clamp(t);return t*t*(3-2*t)};
const bell=(t,a,b)=>{const u=seg(t,a,b);return Math.sin(Math.PI*u)**2};
const eo3=x=>{x=clamp(x);return 1-Math.pow(1-x,3)}, eio3=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t)))).join(',')+')'}
function popS(tau,w=17,z=.45){ if(tau<=0)return 0; const wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+z*w/wd*Math.sin(wd*tau)); }
const L2D=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];

// ---------------- timeline (100 bpm, beat .6 s, bar 2.4 s) ----------------
const DUR=31.2;
const XS=[-420,-210,0,210,420];                 // our row: you + director, artist, composer, editor
const APPEAR=[.3,5.4,6.0,6.6,7.2];
const SEND=4.8;                                 // the sentence is sent: you turn accent, the pulse leaves
const PV=350;                                   // pulse speed (world px / s): reaches each crew member as it pops up
const CLASP=[9.6,10.5,11.1,11.4];               // clasp k (1..4) between figure k-1 and k: faster and faster
const RUN0=12.0, RUNSTEP=.2, runAt=k=>RUN0+RUNSTEP*k;
const PULL0=14.4, PULL1=17.4;                   // pull back to the crowd
const TURN=21.6;                                // after the silent bar: everyone turns to you
const NAMES=['BẠN','ĐẠO DIỄN','HỌA SĨ','NHẠC SĨ','DỰNG PHIM'];

// ---------------- paper ----------------
let paperC=null;
function paper(){
  if(!paperC){ paperC=document.createElement('canvas');paperC.width=W;paperC.height=H;
    const x=paperC.getContext('2d');x.fillStyle=C.paper;x.fillRect(0,0,W,H);
    const id=x.getImageData(0,0,W,H),d=id.data,r=mulberry(11);
    for(let i=0;i<d.length;i+=4){const n=(r()+r()-1)*3;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
    x.putImageData(id,0,0); }
  g.setTransform(1,0,0,1,0,0); g.drawImage(paperC,0,0);
}

// ---------------- camera: centre + log zoom ----------------
const CAMK=[ // t, cx, cy, z, ease-in from previous
  [0,    0,   -340, 1.0 ],
  [4.8,  0,   -330, 1.03],
  [9.6,  40,  -340, 1.0 ],
  [14.4, -105,-315, 1.08],
  [17.4, 480, -460, .375],
  [21.6, 470, -455, .385],
  [22.2, 468, -455, .387],
  [25.2, -553,-433, .6  ],
  [31.2, -548,-433, .62 ],
];
const CAMEASE=[null,eio3,ss,eio3,eio3,ss,ss,eio3,ss];
function cam(t){
  let i=1; while(i<CAMK.length-1&&t>CAMK[i][0])i++;
  const A=CAMK[i-1],B=CAMK[i], u=CAMEASE[i](seg(t,A[0],B[0]));
  const z=Math.exp(lerp(Math.log(A[3]),Math.log(B[3]),u));
  // anchored on you: your screen position moves in a straight line while the zoom changes in log space,
  // so nothing swings through the text column during the big zooms
  const ax=-420, ay=-120, sp=(K)=>[W/2+(ax-K[1])*K[3], H/2+(ay-K[2])*K[3]];
  const sa=sp(A), sb=sp(B), sx=lerp(sa[0],sb[0],u), sy=lerp(sa[1],sb[1],u);
  return {cx:ax-(sx-W/2)/z, cy:ay-(sy-H/2)/z, z};
}
let CAM={cx:0,cy:0,z:1};
const toS=(x,y)=>[W/2+(x-CAM.cx)*CAM.z, H/2+(y-CAM.cy)*CAM.z];
const worldT=()=>g.setTransform(CAM.z,0,0,CAM.z,W/2-CAM.cx*CAM.z,H/2-CAM.cy*CAM.z);
const ZB=()=>CAM.z<1?Math.pow(1/CAM.z,.3):1;    // a little extra line weight when far out

// ---------------- skeleton (figure height = 1) ----------------
const GEO={ thigh:.215, shin:.215, hipH:.42, spine:.285, sh:.065, upper:.18, fore:.155, headR:.112, stance:.09 };
function rest(){ return { hx:0,hy:0,lean:0,bend:0,head:0, la:-.56,lb:.24,ra:.56,rb:-.24, lfx:0,lfy:0,rfx:0,rfy:0,hdx:0,hdy:0 }; }
const KEYS=Object.keys(rest());
const dirv=a=>[Math.sin(a),Math.cos(a)];
function ik(Hh,Ft,L1,L2,side){
  let dx=Ft[0]-Hh[0],dy=Ft[1]-Hh[1],d=Math.hypot(dx,dy);const m=(L1+L2)*.9995;
  if(d>m){Ft=[Hh[0]+dx/d*m,Hh[1]+dy/d*m];dx=Ft[0]-Hh[0];dy=Ft[1]-Hh[1];d=m;}
  const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const px=Hh[0]+a*dx/d,py=Hh[1]+a*dy/d;let nx=-dy/d,ny=dx/d; if(nx*side<0){nx=-nx;ny=-ny}
  return [[px+nx*h,py+ny*h],Ft];
}
function joints(f,p){
  const S=f.S,bx=f.x,gy=f.gy;
  const Hp=[bx+p.hx*S, gy-(GEO.hipH-p.hy)*S];
  const sd=dirv(Math.PI-p.lean);
  const N=[Hp[0]+sd[0]*GEO.spine*S, Hp[1]+sd[1]*GEO.spine*S];
  const mid=[(Hp[0]+N[0])/2,(Hp[1]+N[1])/2], perp=[-sd[1],sd[0]];
  const Cc=[mid[0]+perp[0]*p.bend*S, mid[1]+perp[1]*p.bend*S];
  const u=1-GEO.sh/GEO.spine;
  const Sh=[(1-u)*(1-u)*Hp[0]+2*(1-u)*u*Cc[0]+u*u*N[0],(1-u)*(1-u)*Hp[1]+2*(1-u)*u*Cc[1]+u*u*N[1]];
  const lag=clamp(p.hdx/GEO.headR*.9,-.35,.35);
  const hd=dirv(Math.PI-(p.lean+p.head+lag)), hr=GEO.headR*S;
  const Hd=[N[0]+hd[0]*hr, N[1]+hd[1]*hr];
  const arm=(a,b)=>{const e=dirv(a),E=[Sh[0]+e[0]*GEO.upper*S,Sh[1]+e[1]*GEO.upper*S];const w=dirv(a+b);return [E,[E[0]+w[0]*GEO.fore*S,E[1]+w[1]*GEO.fore*S]]};
  const st=GEO.stance, footL=[bx+(-st+p.lfx)*S, gy-p.lfy*S], footR=[bx+(st+p.rfx)*S, gy-p.rfy*S];
  return { Hp,N,Cc,Sh,Hd,S, aL:arm(p.la,p.lb), aR:arm(p.ra,p.rb),
    lL:ik(Hp,footL,GEO.thigh*S,GEO.shin*S,-1), lR:ik(Hp,footR,GEO.thigh*S,GEO.shin*S,1) };
}
const FS={ w:8, head:7.5, k:.8 };
function ctrl(A,B,E,k){ const m=[(A[0]+E[0])/2,(A[1]+E[1])/2]; return [B[0]+(B[0]-m[0])*k, B[1]+(B[1]-m[1])*k]; }
const qpt=(A,Q,E,t)=>{const s=1-t;return [s*s*A[0]+2*s*t*Q[0]+t*t*E[0], s*s*A[1]+2*s*t*Q[1]+t*t*E[1]]};
const lwOf=(S,lwk)=>Math.max(3*lwk,FS.w*clamp(Math.sqrt(S/380),.6,1.05)*lwk);
function figure(f,j){
  const S=f.S, col=f.col||C.ink, fill=f.fill||C.paper, lwk=f.lwk??1;
  const lw=lwOf(S,lwk), hw=Math.max(3*lwk,FS.head*clamp(Math.sqrt(S/380),.6,1.05)*lwk);
  g.save(); g.strokeStyle=col; g.lineCap='round'; g.lineJoin='round'; g.lineWidth=lw; g.beginPath();
  for(const [K,Ft] of [j.lL,j.lR]){ const Q=ctrl(j.Hp,K,Ft,FS.k); g.moveTo(j.Hp[0],j.Hp[1]); g.quadraticCurveTo(Q[0],Q[1],Ft[0],Ft[1]); }
  g.moveTo(j.Hp[0],j.Hp[1]); g.quadraticCurveTo(j.Cc[0],j.Cc[1],j.N[0],j.N[1]);
  [j.aL,j.aR].forEach(([El,Hn],ai)=>{ if(ai===0&&f.noL||ai===1&&f.noR)return; const Q=ctrl(j.Sh,El,Hn,FS.k); g.moveTo(j.Sh[0],j.Sh[1]); g.quadraticCurveTo(Q[0],Q[1],Hn[0],Hn[1]); });
  g.stroke();
  g.beginPath(); g.arc(j.Hd[0],j.Hd[1],GEO.headR*S,0,Math.PI*2); g.fillStyle=fill; g.fill();
  g.lineWidth=hw; g.stroke(); g.restore();
}

// ---------------- springs ----------------
const SPR={ hx:[20,.8], hy:[24,.62], lean:[13,.6], bend:[12,.55], head:[9,.42],
  la:[13,.58], ra:[13,.58], lb:[9.5,.46], rb:[9.5,.46], lfx:[30,.85], lfy:[30,.85], rfx:[30,.85], rfy:[30,.85] };
const HEADSPR=[16,.38];
function simulate(n,target,t0,t1){
  const dt=1/1200, every=5, out=[];
  const st=[];for(let i=0;i<n;i++){const p=target(i,t0),v={};for(const k in p)v[k]=0; st.push({p:{...p},v,hp:null,hv:[0,0]});}
  const rigidHead=p=>{const hy=GEO.hipH-p.hy,s=GEO.spine,r=GEO.headR;
    return [p.hx+Math.sin(p.lean)*s+Math.sin(p.lean+p.head)*r, hy+Math.cos(p.lean)*s+Math.cos(p.lean+p.head)*r]};
  let step=0;
  for(let t=t0;t<=t1+1e-9;t+=dt,step++){
    if(step%every===0) out.push(st.map(s=>({...s.p})));
    for(let i=0;i<n;i++){ const s=st[i],tg=target(i,t);
      for(const k in SPR){const [w,z]=SPR[k];const a=w*w*(tg[k]-s.p[k])-2*z*w*s.v[k];s.v[k]+=a*dt;s.p[k]+=s.v[k]*dt;}
      const R=rigidHead(s.p); if(!s.hp)s.hp=[...R]; const [w,z]=HEADSPR;
      for(let q=0;q<2;q++){const a=w*w*(R[q]-s.hp[q])-2*z*w*s.hv[q];s.hv[q]+=a*dt;s.hp[q]+=s.hv[q]*dt;}
      s.p.hdx=clamp(s.hp[0]-R[0],-.03,.03); s.p.hdy=clamp(s.hp[1]-R[1],-.03,.03); }
  }
  return {t0,rate:240,frames:out,at(t){const f=(t-this.t0)*this.rate,i=clamp(Math.floor(f),0,this.frames.length-2),u=clamp(f-i);
    const A=this.frames[i],B=this.frames[i+1];return A.map((p,k)=>{const q={};for(const key of KEYS)q[key]=lerp(p[key],B[k][key],u);return q})}};
}
const UP={ la:-2.25, lb:-.5, ra:2.25, rb:.5 };
function breathe(p,t,ph,k=1){
  p.hx+=.004*k*Math.sin(t*1.25+ph); p.lean+=.01*k*Math.sin(t*1.05+ph*1.3);
  p.hy+=.004*k*(.5+.5*Math.sin(t*2.1+ph)); p.la-=.03*k*Math.sin(t*1.5+ph); p.ra+=.03*k*Math.sin(t*1.5+ph+.7);
}
// turn toward you at the cue, as a ripple of attention spreading out from you
function turnTo(p,t,wx,wy,amp=1){
  const dx=XS[0]-wx, d=Math.hypot(dx,wy), tl=TURN+d/5200, dir=clamp(dx/260,-1,1);
  p.hy+=.016*bell(t,tl-.22,tl+.04);
  const L=ss(seg(t,tl,tl+.45))*amp; p.lean+=dir*.13*L; p.head+=dir*.3*L; p.hx+=dir*.012*L;
}

// ---------------- our row: springs ----------------
function ourTarget(i,t){
  const p=rest(), ph=i*1.93+.4; breathe(p,t,ph);
  if(i===0){
    // sending the sentence: crouch (anticipation), a small hop, arms flick up a little
    const c=ss(seg(t,SEND-.42,SEND-.14))*(1-ss(seg(t,SEND-.12,SEND-.03)));
    p.hy+=.02*c; p.la-=.1*c; p.ra+=.1*c; p.head+=.05*c;
    const hop=Math.sin(Math.PI*seg(t,SEND-.06,SEND+.22)); if(hop>0){p.lfy=p.rfy=.05*hop;p.hy-=.05*hop;}
    if(t>SEND-.06&&t<SEND+.5){ p.la=-1.15; p.lb=-.35; p.ra=1.15; p.rb=.35; }
    // watches the pulse and the crew arrive
    const L=ss(seg(t,SEND+.3,SEND+.7))*(1-ss(seg(t,9.2,9.5))); p.head+=.16*L; p.lean+=.02*L;
    // wave with the free (left) hand when everyone turns to look
    if(t>=TURN+.45&&t<TURN+2.1){ const w=Math.sin(2*Math.PI*1.6*(t-TURN-.45))*ss(seg(t,TURN+.45,TURN+.7))*(1-ss(seg(t,TURN+1.8,TURN+2.1)));
      p.la=-2.2+.15*w; p.lb=-.45+.6*w; p.lean=-.03; }
    p.hy+=.02*bell(t,TURN-.25,TURN+.05);
  } else {
    // look left toward you after popping up, until joined
    const c=CLASP[i-1], L=ss(seg(t,APPEAR[i]+.1,APPEAR[i]+.35))*(1-ss(seg(t,c+.25,c+.6)));
    p.head-=.18*L; p.lean-=.04*L;
    p.hy+=.02*bell(t,runAt(i)-.03,runAt(i)+.24); p.head+=.05*bell(t,runAt(i)-.03,runAt(i)+.3);   // nod as the accent reaches
    turnTo(p,t,XS[i],0);
  }
  for(let k=1;k<=4;k++){ let dir=0; if(i===k-1)dir=1; else if(i===k)dir=-1; else continue;
    const c=CLASP[k-1]; p.lean-=dir*.035*bell(t,c-.42,c-.2);
    const tug=bell(t,c-.04,c+.42); p.lean+=dir*.07*tug; p.hy+=.006*tug; }
  return p;
}

// ---------------- the crowd: 11 more chains, analytic poses ----------------
const CH=[];
for(const r of [-2,-1,0,1]) for(const c of [0,1,2]){ if(r===0&&c===0)continue;
  CH.push({r,c,x0:c*1200-420,gy:r*620,d:Math.hypot(c*1200,r*620*1.4)}); }
CH.sort((a,b)=>a.d-b.d);
CH.forEach((ch,j)=>{ const s=14.75+.15*j; ch.start=s; ch.pop=[0,1,2,3,4].map(i=>s+.05*i);
  ch.clasp=[1,2,3,4].map(k=>s+.42+.07*k); ch.xs=[0,1,2,3,4].map(i=>ch.x0+210*i); ch.seed=j*7.31+1.7; });
function crowdPose(ch,i,t){
  const p=rest(), ph=ch.seed+i*2.17; breathe(p,t,ph,1.2);
  if(i>=1){ const L=ss(seg(t,ch.pop[i]+.05,ch.pop[i]+.2))*(1-ss(seg(t,ch.clasp[i-1]+.1,ch.clasp[i-1]+.4))); p.head-=.15*L; }
  turnTo(p,t,ch.xs[i],ch.gy);
  return p;
}

// ---------------- clasp geometry: both hands travel to the clasp point, then the two arms become one curve ----------------
function elbow(Sh,Hn,L1,L2){
  let dx=Hn[0]-Sh[0],dy=Hn[1]-Sh[1],d=Math.hypot(dx,dy)||1e-6;
  if(d>=L1+L2) return [Sh[0]+dx/d*L1*d/(L1+L2), Sh[1]+dy/d*L1*d/(L1+L2)];
  const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  let nx=-dy/d,ny=dx/d; if(ny<0){nx=-nx;ny=-ny}
  return [Sh[0]+a*dx/d+nx*h, Sh[1]+a*dy/d+ny*h];
}
function link(A,B,c,t){
  let r=seg(t,c-.3,c); r=r<.3? -.10*Math.sin(Math.PI*r/.3) : ss((r-.3)/.7);
  const tc=t-c, bounce=tc>0? .045*Math.exp(-tc*6)*Math.sin(tc*21) : 0;
  const Sz=(A.S+B.S)/2;
  const Pc=[(A.Sh[0]+B.Sh[0])/2, (A.Sh[1]+B.Sh[1])/2 + (.17+bounce)*Sz];
  const hi=L2D(A.aR[1],Pc,r), hj=L2D(B.aL[1],Pc,r);
  const Ei=elbow(A.Sh,hi,GEO.upper*A.S,GEO.fore*A.S), Ej=elbow(B.Sh,hj,GEO.upper*B.S,GEO.fore*B.S);
  let Qi=ctrl(A.Sh,Ei,hi,FS.k), Qj=ctrl(B.Sh,Ej,hj,FS.k);
  const jw=r>=1?ss(seg(t,c,c+.14)):0;
  if(jw>0){ let d=[Qj[0]-Qi[0],Qj[1]-Qi[1]], l=Math.hypot(d[0],d[1])||1; d=[d[0]/l,d[1]/l];
    const li=Math.hypot(Pc[0]-Qi[0],Pc[1]-Qi[1]), lj=Math.hypot(Qj[0]-Pc[0],Qj[1]-Pc[1]);
    Qi=L2D(Qi,[Pc[0]-d[0]*li,Pc[1]-d[1]*li],jw); Qj=L2D(Qj,[Pc[0]+d[0]*lj,Pc[1]+d[1]*lj],jw); }
  return { Si:A.Sh,Qi,hi, Sj:B.Sh,Qj,hj, joined:r>=1 };
}
function quadPts(A,Q,E,n=16){ const o=[]; for(let i=0;i<=n;i++)o.push(qpt(A,Q,E,i/n)); return o; }
function polyLen(P){ let L=0; for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]); return L; }
function strokePoly(P,upto){ g.beginPath(); g.moveTo(P[0][0],P[0][1]); let L=0;
  for(let i=1;i<P.length;i++){ const s=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);
    if(L+s>=upto){ const u=(upto-L)/s; g.lineTo(lerp(P[i-1][0],P[i][0],u),lerp(P[i-1][1],P[i][1],u)); break; }
    g.lineTo(P[i][0],P[i][1]); L+=s; } g.stroke(); }
function drawLinkHalves(L,colI,colJ,lwI,lwJ){
  g.save(); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=colI; g.lineWidth=lwI; g.beginPath(); g.moveTo(L.Si[0],L.Si[1]); g.quadraticCurveTo(L.Qi[0],L.Qi[1],L.hi[0],L.hi[1]); g.stroke();
  g.strokeStyle=colJ; g.lineWidth=lwJ; g.beginPath(); g.moveTo(L.hj[0],L.hj[1]); g.quadraticCurveTo(L.Qj[0],L.Qj[1],L.Sj[0],L.Sj[1]); g.stroke();
  g.restore();
}

// ---------------- text ----------------
let TXT=null;
function text(s,x,y,{size=28,w=500,col=C.ink,track=0,a=1,align='left',id=s,pass=false,full=null}={}){
  if(a<=0.001)return;
  g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=clamp(a); g.font=`${w} ${size}px ${F}`; g.fillStyle=col; g.textAlign=align;
  g.letterSpacing=track+'px'; g.fillText(s,x,y);
  if(TXT){ const m=g.measureText(full??s), x0=align==='left'?x:align==='right'?x-m.width:x-m.width/2;
    TXT.push({id,text:full??s,x0,y0:y-size*.8,x1:x0+m.width,y1:y+size*.25,pass}); }
  g.restore();
}
// screen text that arrives (slide up + fade) and leaves (fade)
function card(t,o){
  const a=eo3(seg(t,o.t0,o.t0+.4))*(1-ss(seg(t,o.t1-.3,o.t1)));
  if(a<=0)return;
  const dy=(o.slide??16)*(1-eo3(seg(t,o.t0,o.t0+.45)));
  let s=o.s, full=null;
  if(o.type){ const n=Math.floor(o.s.length*seg(t,o.type[0],o.type[1])); s=o.s.slice(0,n); full=o.s; }
  text(s,o.x,o.y+dy,{...o,a,full,id:o.id});
}
function wtext(s,wx,wy,o){ const [x,y]=toS(wx,wy); text(s,x,y,{...o,size:o.size*CAM.z,align:'center',pass:o.pass??false}); }

const CARDS=[
  {id:'h1',s:'BẠN CHỈ CẦN GÕ MỘT CÂU',x:124,y:128,size:22,w:500,col:C.mute,track:3,t0:.6,t1:9.6},
  {id:'p', s:'“Làm phim ngắn về quán cà phê của mẹ.”',x:114,y:238,size:64,w:600,track:-2,t0:1.2,t1:9.6,type:[1.2,3.0]},

const COUNT0=15.0, COUNT1=17.0;

// ---------------- the frame ----------------
let SIM=null;
function frame(t){
  CAM=cam(t); paper(); worldT();
  const zb=ZB(), P=SIM.at(t);
  const youA=ss(seg(t,SEND-.05,SEND+.1));
  // ground lines
  g.save(); g.lineCap='round'; g.strokeStyle=C.tint; g.lineWidth=7*zb;
  { const d=eio3(seg(t,0,.8)); if(d>0){ g.beginPath(); g.moveTo(-620,40); g.lineTo(lerp(-620,620,d),40); g.stroke(); } }
  for(const ch of CH){ const d=eio3(seg(t,ch.start-.12,ch.start+.3)); if(d<=0)continue;
    g.beginPath(); g.moveTo(ch.x0-100,ch.gy+40); g.lineTo(lerp(ch.x0-100,ch.x0+940,d),ch.gy+40); g.stroke(); }
  // the pulse: the sentence runs along the line from you to the right
  const run=t-SEND;
  if(run>0){ const head=Math.min(620,XS[0]+run*PV), tail=Math.min(620,XS[0]+Math.max(0,run*PV-170));
    if(head-tail>1){ g.strokeStyle=C.sig; g.beginPath(); g.moveTo(tail,40); g.lineTo(head,40); g.stroke(); } }
  g.restore();

  // crowd
  for(const ch of CH){
    if(t<ch.pop[0])continue;
    const sc=ch.pop.map(a=>popS(t-a)), J=ch.xs.map((x,i)=>sc[i]>.01?joints({x,gy:ch.gy,S:360*sc[i]},crowdPose(ch,i,t)):null);
    const lwk=i=>clamp(sc[i]*1.6)*zb;
    for(let k=1;k<=4;k++){ const c=ch.clasp[k-1]; if(t<c-.3||!J[k-1]||!J[k])continue;
      drawLinkHalves(link(J[k-1],J[k],c,t),C.ink,C.ink,lwOf(J[k-1].S,lwk(k-1)),lwOf(J[k].S,lwk(k))); }
    J.forEach((j,i)=>{ if(!j)return; const noL=i>=1&&t>=ch.clasp[i-1]-.3&&!!J[i-1], noR=i<=3&&t>=ch.clasp[i]-.3&&!!J[i+1];
      figure({S:j.S,lwk:lwk(i),noL,noR},j); });
  }

  // our row
  const sc=XS.map((_,i)=>popS(t-APPEAR[i]));
  const J=XS.map((x,i)=>sc[i]>.01?joints({x,gy:0,S:360*sc[i]},P[i]):null);
  const lwk=i=>clamp(sc[i]*1.6)*zb;
  const colOf=i=>i===0?mix(C.ink,C.sig,youA):C.ink;
  const links=[];
  for(let k=1;k<=4;k++){ const c=CLASP[k-1]; if(t<c-.3||!J[k-1]||!J[k])continue;
    const L=link(J[k-1],J[k],c,t); links.push([k,L]);
    drawLinkHalves(L,colOf(k-1),colOf(k),lwOf(J[k-1].S,lwk(k-1)),lwOf(J[k].S,lwk(k))); }
  for(const [k,L] of links){ const f=seg(t,runAt(k-1),runAt(k)); if(f<=0||!L.joined)continue;
    const Pp=quadPts(L.Si,L.Qi,L.hi).concat(quadPts(L.hj,L.Qj,L.Sj).slice(1)), len=polyLen(Pp), half=polyLen(quadPts(L.Si,L.Qi,L.hi));
    const reach=k===1?Math.max(half,f*len):f*len;
    g.save(); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle=C.sig; g.lineWidth=lwOf(J[k].S,lwk(k))+.6*zb; strokePoly(Pp,reach); g.restore(); }
  J.forEach((j,i)=>{ if(!j)return;
    const noL=i>=1&&t>=CLASP[i-1]-.3&&!!J[i-1], noR=i<=3&&t>=CLASP[i]-.3&&!!J[i+1];
    figure({S:j.S,lwk:lwk(i),noL,noR,col:colOf(i),fill:i===0?mix(C.paper,C.sig,youA):C.paper},j); });

  // names under the line (world space), gone during the pull back
  const out=1-ss(seg(t,PULL0,PULL0+.5));
  NAMES.forEach((n,i)=>{ const a=ss(seg(t,APPEAR[i]+.25,APPEAR[i]+.6))*out; if(a<=0)return;
    const on=i===0?youA:ss(seg(t,runAt(i)-.02,runAt(i)+.12));
    wtext(n,XS[i],100,{size:21,w:600,col:mix(C.mute,C.sig,on),track:3*CAM.z,a,id:'n'+i}); });

  // screen type
  for(const o of CARDS) card(t,o);
  // the count: 1 → 99 as the chains appear, then held
  { const a=eo3(seg(t,COUNT0,COUNT0+.4))*(1-ss(seg(t,TURN-.3,TURN))); if(a>0){
      const n=Math.max(1,Math.round(99*eio3(seg(t,COUNT0,COUNT1)))), done=t>=COUNT1;
      text(String(n),112,486+22*(1-eo3(seg(t,COUNT0,COUNT0+.5))),{size:190,w:600,track:-6,a,id:done?'n99':'count',pass:!done}); } }
}

// ---------------- sound events ----------------
function events(){
  const E=[];
  E.push({t:0,type:'line',d:.8});
  APPEAR.forEach((a,i)=>E.push({t:a,type:'pop',i,pan:XS[i]/960}));
  const P=CARDS.find(c=>c.id==='p'); for(let i=0;i<P.s.length;i+=2) E.push({t:P.type[0]+(P.type[1]-P.type[0])*i/P.s.length,type:'tick'});
  E.push({t:SEND,type:'send'}); E.push({t:SEND,type:'pulse',d:(620-XS[0])/PV});
  CLASP.forEach((c,k)=>{ E.push({t:c-.3,type:'reach',k:k+1}); E.push({t:c,type:'clasp',k:k+1,pan:(XS[k]-105)/960}); });
  for(let k=1;k<=4;k++) E.push({t:runAt(k),type:'node',k,pan:XS[k]/960});
  E.push({t:runAt(0),type:'run',d:runAt(4)-runAt(0)});
  E.push({t:PULL0,type:'pull',d:PULL1-PULL0});
  CH.forEach((ch,j)=>{ E.push({t:ch.start,type:'cpop',j}); E.push({t:ch.clasp[3],type:'cclasp',j}); });
  E.push({t:TURN,type:'turn'}); E.push({t:TURN+.45,type:'wave'});
  for(const o of CARDS) E.push({t:o.t0,type:'text',id:o.id});
  E.push({t:DUR,type:'end'});
  return E;
}

// ---------------- page contract ----------------
window.DUR=DUR-FROM;
window.EV=events().map(e=>({...e,t:e.t-FROM})).filter(e=>e.t>=0);
window.render=t=>frame(FROM+t);
window.TEXTS=t=>{ TXT=[]; window.render(t); const o=TXT; TXT=null; return o.filter(o=>o.x1>0&&o.x0<W); };
const SAMPLE='Làm phim ngắn về quán cà phê của mẹ. Đạo diễn, vẽ, soạn nhạc, hòa âm. Một câu lệnh ĐẠO DIỄN HỌA SĨ DỰNG PHIM “”';
Promise.all([400,500,600].map(w=>document.fonts.load(`${w} 40px ${F}`,SAMPLE))).then(()=>{
  SIM=simulate(5,ourTarget,-1.5,DUR+.2); window.render(0); window.READY=true; });
</script>
